; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<tft_test_main.cpp> -<sd_test_main.cpp> +<../ui/*>
lib_deps = https://github.com/amrikarisma/TFT_eSPI.git
    https://github.com/amrikarisma/esp32_can.git
	https://github.com/amrikarisma/can_common.git
    lvgl/lvgl@^9.2.0
build_flags =
    -D USER_SETUP_LOADED
    -D ILI9488_DRIVER
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D LOAD_GLCD=1
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D LOAD_FONT6
    -D LOAD_FONT7
    -D LOAD_FONT8
    -D LOAD_GFXFF
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=20000000
    -D SPI_READ_FREQUENCY=16000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I src
    -I ui

[env:esp32dev-demo]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D DEMO_MODE

[env:tft_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<tft_test_main.cpp>
lib_deps = https://github.com/amrikarisma/TFT_eSPI.git
build_flags =
    -D USER_SETUP_LOADED
    -D ILI9488_DRIVER
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D LOAD_GLCD=1
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D LOAD_FONT6
    -D LOAD_FONT7
    -D LOAD_FONT8
    -D LOAD_GFXFF
    -D SMOOTH_FONT
    -D SPI_FREQUENCY=20000000
    -D SPI_READ_FREQUENCY=16000000
    -D SPI_TOUCH_FREQUENCY=2500000

[env:sd_test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_src_filter = -<*> +<sd_test_main.cpp>
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Memory configuration for ESP32-S3 WROOM N16 (no PSRAM detected on this board)
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; Serial Monitor configuration
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = +<*> -<tft_test_main.cpp> -<sd_test_main.cpp> +<../ui/*>
lib_deps = https://github.com/amrikarisma/TFT_eSPI.git
    https://github.com/amrikarisma/esp32_can.git
	https://github.com/amrikarisma/can_common.git
    lvgl/lvgl@^9.2.0
    adafruit/Adafruit NeoPixel@^1.12.3
build_flags =
    -D USER_SETUP_LOADED
    -D ILI9488_DRIVER
    -D TFT_MISO=38
    -D TFT_MOSI=41
    -D TFT_SCLK=40
    -D TFT_CS=48
    -D TFT_DC=47
    -D TFT_RST=21
    -D LOAD_GLCD=10
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D LOAD_FONT6
    -D LOAD_FONT7
    -D LOAD_FONT8
    -D LOAD_GFXFF
    -D SMOOTH_FONT
    -D SPI_FREQUENCY=27000000
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BACKLIGHT_PIN=39
    -D GEAR_SEG_A=4
    -D GEAR_SEG_B=5
    -D GEAR_SEG_C=6
    -D GEAR_SEG_D=7
    -D GEAR_SEG_E=8
    -D GEAR_SEG_F=9
    -D GEAR_SEG_G=10
    -D GEAR_COMMON_ANODE=1
    -D ENABLE_CAN=0
    -D WS2812_PIN=42
    -D WS2812_COUNT=8
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I src
    -I ui
 